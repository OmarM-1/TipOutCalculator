<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tipout Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Server Tipout Calculator</h1>

    <form id="tipForm">

      <label for="netCash">Net Cash</label>
      <input
        id="netCash"
        type="number"
        inputmode="numeric"
        min="0"
        step="0.01"
        required
      >

      <label for="beerSales">Beer Sales</label>
      <input
        id="beerSales"
        type="number"
        inputmode="numeric"
        min="0"
        step="0.01"
        required
      >

      <label for="foodSales">Food Sales</label>
      <input
        id="foodSales"
        type="number"
        inputmode="numeric"
        min="0"
        step="0.01"
        required
      >

      <label for="liquorSales">Liquor Sales</label>
      <input
        id="liquorSales"
        type="number"
        inputmode="numeric"
        min="0"
        step="0.01"
        required
      >

      <label for="wineSales">Wine Sales</label>
      <input
        id="wineSales"
        type="number"
        inputmode="numeric"
        min="0"
        step="0.01"
        required
      >

      <label for="totalSales">Total Net Sales</label>
      <input
        id="totalSales"
        type="number"
        inputmode="numeric"
        min="0"
        step="0.01"
        required
      >

      <label for="creditCardTips">
        Credit Card Tips (optional)
      </label>
      <input
        id="creditCardTips"
        type="number"
        inputmode="numeric"
        min="0"
        step="0.01"
      >

      <button type="submit">Calculate Tipout</button>
    </form>

    <section
      id="results"
      class="results"
      aria-live="polite"
      hidden
    ></section>
  </main>
</body>
</html>
